# =============================================================================
# Cloudflare Worker Configuration for Appvizo
# Independent D1 Database (appvizo-db) and Independent Private R2 Bucket (appvizo-assets)
# =============================================================================

name = "appvizo-portal"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 Database Binding (Independent Appvizo Database)
[[d1_databases]]
binding = "DB"
database_name = "appvizo-db"
database_id = "8bde1967-babd-4fb1-80c3-2ed550766207"

# Cloudflare R2 Storage Bucket Binding (Independent Appvizo Bucket)
[[r2_buckets]]
binding = "APPVIZO_ASSETS"
bucket_name = "appvizo-assets"
